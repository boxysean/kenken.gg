name: Test
on: [pull_request]

jobs:
  test-web:
    name: Test Web
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v1

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x

    - name: Install
      working-directory: web
      run: npm ci

    - name: Test
      working-directory: web
      env:
        CI: true
      run: npm test

    - name: Typecheck
      working-directory: web
      run: npm run typecheck
